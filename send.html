<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>给我留言</title>
    <style>
        @font-face {
            font-family: "Cmdysj";
            src: url("./file/cmdysj.ttf") format("truetype");
            font-display: swap;
        }

        :root {
            --night: #17141f;
            --ink: #29202d;
            --plum: #493744;
            --mist: rgba(226, 201, 197, 0.76);
            --mist-light: rgba(246, 225, 211, 0.88);
            --gold: #e7ad62;
            --ember: #bd684e;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(2rem, 7vw, 6rem) 1.25rem;
            color: var(--mist-light);
            text-align: center;
            font-family: "Cmdysj", Georgia, "Noto Serif SC", serif;
            background:
                linear-gradient(135deg, rgba(23, 20, 31, 0.9), rgba(71, 47, 57, 0.7)),
                url("./file/IMG_2324.webp") center / cover fixed;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: -1;
            content: "";
            background: radial-gradient(circle at 50% 12%, rgba(231, 173, 98, 0.16), transparent 34rem);
            pointer-events: none;
        }

        h1 {
            margin: 0 auto 2rem;
            color: var(--mist-light);
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 500;
            letter-spacing: 0.08em;
            text-shadow: 0 2px 24px rgba(9, 7, 14, 0.75);
        }

        h1 small {
            display: block;
            margin-top: 0.4rem;
            color: var(--gold);
            font-size: 0.4em;
            letter-spacing: 0.2em;
        }

        .form-card {
            width: min(28rem, 90vw);
            margin: 0 auto;
            padding: 2rem 2.5rem;
            border: 1px solid rgba(231, 173, 98, 0.48);
            border-radius: 1rem;
            background: rgba(42, 28, 39, 0.7);
            box-shadow: 0 1rem 3rem rgba(11, 8, 16, 0.4);
            backdrop-filter: blur(0.7rem);
            text-align: left;
            animation: contact-fade-in 900ms 160ms ease both;
        }

        @keyframes contact-fade-in {
            from { transform: translateY(2rem); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        input[type="text"],
        textarea {
            width: 100%;
            box-sizing: border-box; 
            margin-bottom: 1.2rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(231, 173, 98, 0.3);
            border-radius: 0.5rem;
            color: var(--mist-light);
            background: rgba(23, 20, 31, 0.6);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 300ms ease, box-shadow 300ms ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(231, 173, 98, 0.2);
        }

        textarea {
            display: block; 
            height: 8rem;
            resize: vertical;
        }

        .input-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }
        
        .input-row input[type="text"] {
            margin-bottom: 0; 
            flex: 1; 
            min-width: 0; 
        }

        @media (max-width: 450px) {
            .input-row {
                flex-direction: column;
                gap: 0;
            }
            .input-row input[type="text"] {
                margin-bottom: 1.2rem;
            }
        }

        /* 美化文件上传按钮 */
        input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 1.5rem;
            padding: 0.5rem;
            border: 1px dashed rgba(231, 173, 98, 0.5);
            border-radius: 0.5rem;
            color: var(--mist);
            font-family: inherit;
            font-size: 0.9rem;
            background: rgba(23, 20, 31, 0.3);
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            padding: 0.4rem 0.8rem;
            margin-right: 1rem;
            border: none;
            border-radius: 0.3rem;
            color: var(--ink);
            background: var(--gold);
            font-family: inherit;
            cursor: pointer;
        }

        button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 0.9rem;
            border: none;
            border-radius: 999px;
            color: var(--ink);
            background: var(--gold);
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 180ms ease, background 180ms ease;
        }

        button:hover {
            background: #f3c985;
            transform: translateY(-2px);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <h1>给我留言<small>Leave a Message</small></h1>
    
    <div class="form-card">
        <!-- 关键改动：加入 data-netlify 属性，指定 action 为 success.html -->
        <form name="contact" method="POST" data-netlify="true" enctype="multipart/form-data" action="/success.html">
            
            <!-- Netlify 必需的隐藏字段，name 必须与 form 的 name 一致 -->
            <input type="hidden" name="form-name" value="contact">
            
            <!-- 防垃圾蜜罐字段 -->
            <p class="hidden">
                <label>不要填这个：<input name="bot-field"></label>
            </p>

            <div class="input-row">
                <input type="text" name="name" placeholder="你的名字（必填）" required autocomplete="off">
                <input type="text" name="contact" placeholder="联系方式（选填）" autocomplete="off">
            </div>
            
            <textarea name="message" placeholder="输入你想说的话..." required></textarea>
            
            <!-- 文件上传字段 -->
            <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--gold);">
                📎 添加附件（可选，单文件最大 8MB）
            </label>
            <input type="file" name="attachment">
            
            <button type="submit">发送留言</button>
        </form>
    </div>
</body>
</html>
