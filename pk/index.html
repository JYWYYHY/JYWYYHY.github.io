<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PK帅照</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #1a0b1f 0%, #2d1b33 50%, #1f1225 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 56px;
            padding: 48px 40px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.08);
            transition: transform 0.2s ease;
        }

        .container:hover {
            transform: scale(1.01);
        }

        h1 {
            color: #ffe9b6;
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 0.04em;
            margin-bottom: 28px;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.15);
            word-break: break-word;
        }

        h1 span {
            display: inline-block;
            background: rgba(255, 215, 0, 0.08);
            padding: 0 8px;
            border-radius: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .password-wrapper {
            width: 100%;
            background: rgba(10, 5, 14, 0.5);
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 0, 0.12);
            padding: 0 24px;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
        }

        .password-wrapper:focus-within {
            border-color: #f0c060;
            box-shadow: 0 0 0 3px rgba(240, 192, 96, 0.2);
            background: rgba(20, 10, 28, 0.7);
        }

        .password-wrapper input {
            width: 100%;
            padding: 18px 10px 18px 0;
            background: transparent;
            border: none;
            outline: none;
            color: #f5e6d3;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.4px;
        }

        .password-wrapper input::placeholder {
            color: #8a7a8f;
            font-weight: 300;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .lock-icon {
            color: #c9a86c;
            font-size: 1.2rem;
            opacity: 0.6;
            margin-right: 6px;
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c9a86c 0%, #b58b4a 100%);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-size: 1.15rem;
            font-weight: 500;
            color: #1f1225;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(180, 140, 70, 0.25);
            letter-spacing: 0.5px;
            width: 100%;
            max-width: 200px;
            margin-top: 6px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(180, 140, 70, 0.35);
            background: linear-gradient(135deg, #dbb87a 0%, #c49a54 100%);
        }

        .btn-primary:active {
            transform: translateY(0px);
            background: #a88344;
        }

        .error-link-area {
            margin-top: 18px;
            min-height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error-link {
            color: #e8c88a;
            background: rgba(180, 80, 80, 0.12);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            text-decoration: none;
            border: 1px solid rgba(255, 150, 150, 0.15);
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }

        .error-link:hover {
            background: rgba(200, 100, 100, 0.2);
            border-color: rgba(255, 180, 180, 0.3);
            color: #ffddb0;
            transform: scale(1.03);
        }

        .error-link i {
            font-style: normal;
            margin-right: 6px;
        }

        .footer-hint {
            margin-top: 22px;
            color: #6a5a6f;
            font-size: 0.7rem;
            letter-spacing: 0.4px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
        }

        .footer-hint code {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 30px;
            color: #b8a0b0;
            font-size: 0.65rem;
        }

        /* 错误时输入框闪动 */
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* 响应式 */
        @media (max-width: 420px) {
            .container { padding: 32px 20px 28px; }
            h1 { font-size: 1.5rem; }
            .btn-primary { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>❤ 输入密码查看PK帅照 ❤</h1>

        <div class="input-group">
            <div class="password-wrapper">
                <span class="lock-icon">✦</span>
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="快来把我填满吧" 
                    autocomplete="off"
                >
            </div>
            <button class="btn-primary" id="unlockBtn">✦ 确定 ✦</button>
        </div>

        <!-- 错误时显示超链接 -->
        <div class="error-link-area" id="errorLinkArea">
            <!-- 动态插入 -->
        </div>

       
    </div>

    <script>
        (function() {
            // ---------- 核心配置 ----------
            const CORRECT_PASSWORD_A = "zuanka";
            const CORRECT_PASSWORD_B = "htlyglbyhbr20110314cwqmpzwoeirutyg";

            const REDIRECT_URL_A = "./jiade.html";
            const REDIRECT_URL_B = "./sb.html";

            // 错误时显示的超链接 (可自定义)
            const ERROR_LINK_TEXT = "💔 忘记密码？点此求助";
            const ERROR_LINK_URL = "./hqmm.html";

            // ---------- DOM ----------
            const passwordInput = document.getElementById('passwordInput');
            const unlockBtn = document.getElementById('unlockBtn');
            const errorLinkArea = document.getElementById('errorLinkArea');

            // 用于记录是否已经显示错误链接 (避免重复创建)
            let errorLinkDisplayed = false;
            let errorLinkElement = null;

            // ---------- 辅助: 显示错误链接 ----------
            function showErrorLink() {
                // 如果已经存在则不再重复创建
                if (errorLinkDisplayed && errorLinkElement) {
                    // 可添加闪烁效果
                    errorLinkElement.style.transition = 'opacity 0.15s';
                    errorLinkElement.style.opacity = '0.6';
                    setTimeout(() => { errorLinkElement.style.opacity = '1'; }, 150);
                    return;
                }

                // 创建超链接
                const link = document.createElement('a');
                link.href = ERROR_LINK_URL;
                link.target = '_blank';   // 新窗口打开，也可以根据需求改
                link.rel = 'noopener noreferrer';
                link.className = 'error-link';
                link.textContent = ERROR_LINK_TEXT;
                // 添加一个小图标
                link.innerHTML = `<i>🔗</i> ${ERROR_LINK_TEXT}`;

                // 清空区域并添加
                errorLinkArea.innerHTML = '';
                errorLinkArea.appendChild(link);

                errorLinkElement = link;
                errorLinkDisplayed = true;

                // 添加一些动画效果
                link.style.animation = 'none';
                requestAnimationFrame(() => {
                    link.style.animation = 'shake 0.4s ease-in-out';
                });
            }

            // ---------- 隐藏错误链接 (清空区域) ----------
            function hideErrorLink() {
                if (errorLinkArea) {
                    errorLinkArea.innerHTML = '';
                }
                errorLinkDisplayed = false;
                errorLinkElement = null;
            }

            // ---------- 核心验证 ----------
            function handleUnlock() {
                const entered = passwordInput.value;

                // 匹配密码A
                if (entered === CORRECT_PASSWORD_A) {
                    window.location.href = REDIRECT_URL_A;
                    return;
                } 
                
                // 匹配密码B
                if (entered === CORRECT_PASSWORD_B) {
                    window.location.href = REDIRECT_URL_B;
                    return;
                }

                // ---------- 密码错误 ----------
                // 清空输入框
                passwordInput.value = '';
                passwordInput.focus();

                // 输入框抖动反馈
                passwordInput.classList.remove('shake');
                void passwordInput.offsetWidth; // 触发重绘
                passwordInput.classList.add('shake');

                // 显示错误链接
                showErrorLink();

                // 同时控制台输出
                console.warn('⚠️ 密码错误，已显示超链接');
            }

            // ---------- 输入时自动隐藏错误链接 ----------
            passwordInput.addEventListener('input', function() {
                // 只要用户开始输入，就隐藏错误链接
                if (errorLinkDisplayed) {
                    hideErrorLink();
                }
                // 移除抖动类
                passwordInput.classList.remove('shake');
            });

            // ---------- 事件绑定 ----------
            unlockBtn.addEventListener('click', function(e) {
                e.preventDefault();
                handleUnlock();
            });

            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleUnlock();
                }
            });

            // 自动聚焦
            window.addEventListener('load', function() {
                passwordInput.focus();
            });

            // 点击外部空白区域隐藏错误链接? (可选)
            document.addEventListener('click', function(e) {
                // 如果点击的不是密码框、按钮、链接本身，可隐藏错误链接
                const target = e.target;
                const isInput = target === passwordInput;
                const isBtn = target === unlockBtn || target.closest('#unlockBtn');
                const isLink = target.closest('.error-link');

                if (!isInput && !isBtn && !isLink && errorLinkDisplayed) {
                    // 但为了用户体验，点击其他地方不自动隐藏，保持显示
                    // 这里不做自动隐藏，以免用户误触消失
                }
            });

            // 控制台输出
            console.log('🔐 双密码跳转 (增强版) 已启动');
            console.log(`  密码A: "${CORRECT_PASSWORD_A}" → ${REDIRECT_URL_A}`);
            console.log(`  密码B: "${CORRECT_PASSWORD_B}" → ${REDIRECT_URL_B}`);
            console.log(`  错误时显示超链接: "${ERROR_LINK_TEXT}" → ${ERROR_LINK_URL}`);
        })();
    </script>
</body>
</html>
