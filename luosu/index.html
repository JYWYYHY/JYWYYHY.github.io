<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛苏音乐 · 网页版</title>
<link rel="shortcut icon" href="./../file/666.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>洛苏音乐</h1>
  <div class="platform-tabs" id="platformTabs">
    <button data-platform="wymusic" class="active">网易云</button>
    <button data-platform="kgmusic">酷狗</button>
    <button data-platform="qqmusic">QQ音乐</button>
  </div>
  <button class="icon-btn" onclick="toggleSettings()" title="偏好设置">⚙️</button>
</header>

<!-- 常规设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>试听偏好</h2>
    <div class="setting-item">
      <label>搜索数量 (t)</label>
      <select id="setLimit">
        <option value="10">10 首</option>
        <option value="20">20 首</option>
        <option value="50">50 首</option>
        <option value="100">100 首</option>
      </select>
    </div>
    <div class="setting-item">
      <label>在线试听音质 (yz)</label>
      <select id="setQuality"></select>
    </div>
    <div class="modal-actions">
      <button onclick="saveSettings()">保存设置</button>
    </div>
  </div>
</div>

<!-- 下载设置弹窗 -->
<div class="modal-overlay" id="downloadModal">
  <div class="modal">
    <h2>选择下载音质</h2>
    <p style="font-size:12px; color:var(--mist); margin-bottom:15px; text-align:center;">将重新向接口请求该音质的链接</p>
    <div class="setting-item">
      <label>下载音质</label>
      <select id="downloadQualitySelect"></select>
    </div>
    <div class="modal-actions" style="display: flex; justify-content: space-between;">
      <button onclick="document.getElementById('downloadModal').classList.remove('show')" style="background: transparent; border: 1px solid var(--glass-border); color: var(--mist);">取消</button>
      <button onclick="confirmDownload()" id="confirmDownloadBtn">开始下载</button>
    </div>
  </div>
</div>

<main>
  <aside>
    <div class="search-box">
      <input id="keyword" type="text" placeholder="输入歌名…" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" id="searchBtn">搜索</button>
    </div>
    <div class="result-list" id="resultList">
      <div class="placeholder">请输入关键词</div>
    </div>
  </aside>

  <section class="player-area">
    <div class="now-playing">
      <img class="cover" id="cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect fill='%23222' width='48' height='48'/%3E%3Ctext x='24' y='30' text-anchor='middle' fill='%23555' font-size='16'%3E♪%3C/text%3E%3C/svg%3E">
      <div class="info">
        <div class="name" id="nowName">未选择</div>
        <div class="artist" id="nowArtist">—</div>
        <audio id="audio" controls preload="none"></audio>
      </div>
      <div class="action-btns">
        <!-- 文案已修改 -->
        <button class="icon-btn" onclick="openDownloadModal()" id="downloadBtn" disabled>下载</button>
        <button class="icon-btn" onclick="openOfficial()" id="officialBtn" disabled>官方页面</button>
      </div>
    </div>
    <div class="lyric-area" id="lyricArea">
      <div class="placeholder" style="margin-top:40px;">歌词将在这里显示</div>
    </div>
    <div class="status-bar">
      <span id="status">就绪</span>
      <span>Powered by corsproxy.io</span>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
