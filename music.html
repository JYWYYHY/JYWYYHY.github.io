<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 本地音乐播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/music-metadata-browser@7.12.0/dist/index.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1e1e2f 0%, #2a2a3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-card {
            max-width: 860px;
            width: 100%;
            background: rgba(30, 30, 46, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px 28px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            color: #f0f0fa;
        }

        .top-section {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .cover-wrapper {
            flex: 0 0 180px;
            height: 180px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
            background: #2d2d44;
            transition: 0.25s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-wrapper .cover-placeholder {
            color: #666688;
            font-size: 3rem;
        }

        .cover-wrapper .cover-loading {
            position: absolute;
            color: #8888aa;
            font-size: 1.2rem;
        }

        .song-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 180px;
        }

        .song-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .song-artist {
            font-size: 1.1rem;
            font-weight: 400;
            color: #b9b9d6;
            margin-bottom: 12px;
        }

        .progress-area {
            width: 100%;
            margin-top: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #40405a;
            border-radius: 12px;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #b084f0;
            border-radius: 50%;
            box-shadow: 0 0 12px #b084f0aa;
            border: 2px solid #f0f0fa;
            transition: 0.15s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #9a9ab8;
            margin-top: 4px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 18px 0 12px;
            flex-wrap: wrap;
        }

        .controls button {
            background: transparent;
            border: none;
            color: #d0d0ea;
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        .controls button:hover {
            background: rgba(176, 132, 240, 0.2);
            color: #ffffff;
            transform: scale(1.02);
        }

        .controls .play-btn {
            background: #b084f0;
            color: #1a1a2c;
            font-size: 1.8rem;
            width: 64px;
            height: 64px;
            box-shadow: 0 8px 18px #b084f066;
        }

        .controls .play-btn:hover {
            background: #c79aff;
            transform: scale(1.04);
            box-shadow: 0 8px 24px #b084f0aa;
        }

        .controls .active-mode {
            color: #b084f0;
            text-shadow: 0 0 12px #b084f088;
        }

        .lyrics-box {
            background: rgba(20, 20, 34, 0.6);
            border-radius: 28px;
            padding: 18px 22px;
            margin: 12px 0 20px;
            max-height: 110px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.02);
            scroll-behavior: smooth;
        }

        .lyrics-box p {
            margin: 0;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #cacae6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .lyrics-box::-webkit-scrollbar {
            width: 4px;
        }

        .lyrics-box::-webkit-scrollbar-thumb {
            background: #6a6a8e;
            border-radius: 12px;
        }

        .queue-section {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 18px;
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .queue-header h3 {
            font-weight: 500;
            font-size: 1rem;
            color: #b5b5d4;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .queue-header h3 i {
            color: #b084f0;
        }

        .queue-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .queue-actions button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #40405a;
            color: #cacae6;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.15s;
        }

        .queue-actions button:hover {
            background: #b084f022;
            border-color: #b084f088;
            color: #fff;
        }

        .queue-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .queue-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px 8px 18px;
            border-radius: 40px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.15s;
            cursor: default;
            border-left: 3px solid transparent;
        }

        .queue-list li.active {
            background: rgba(176, 132, 240, 0.15);
            border-left-color: #b084f0;
        }

        .queue-list li:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .queue-list li .q-title {
            font-weight: 500;
            color: #eaeaff;
        }

        .queue-list li .q-artist {
            font-size: 0.8rem;
            color: #9999bb;
            margin-left: 12px;
        }

        .queue-list li .q-remove {
            color: #7777a0;
            background: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 6px;
            transition: 0.15s;
        }

        .queue-list li .q-remove:hover {
            color: #ff8a8a;
            transform: scale(1.2);
        }

        .queue-list::-webkit-scrollbar {
            width: 4px;
        }

        .queue-list::-webkit-scrollbar-thumb {
            background: #4d4d70;
            border-radius: 12px;
        }

        .loading-indicator {
            text-align: center;
            padding: 60px 20px;
            color: #b9b9d6;
        }

        .loading-indicator i {
            font-size: 2.5rem;
            margin-bottom: 16px;
            display: block;
            color: #b084f0;
        }

        .loading-indicator .progress-text {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #8888aa;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: rgba(176, 132, 240, 0.15);
            color: #b084f0;
            margin-left: 10px;
        }

        .file-select-area {
            text-align: center;
            padding: 40px 20px;
            border: 2px dashed #40405a;
            border-radius: 24px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .file-select-area:hover {
            border-color: #b084f0;
            background: rgba(176, 132, 240, 0.05);
        }

        .file-select-area i {
            font-size: 3rem;
            color: #b084f0;
            margin-bottom: 12px;
            display: block;
        }

        .file-select-area p {
            color: #b9b9d6;
        }

        .file-select-area .hint {
            font-size: 0.8rem;
            color: #8888aa;
            margin-top: 8px;
        }

        .hidden-input {
            display: none;
        }

        @media (max-width: 600px) {
            .player-card { padding: 20px; }
            .top-section { flex-direction: column; align-items: center; text-align: center; }
            .cover-wrapper { flex: 0 0 160px; height: 160px; }
            .song-title { font-size: 1.8rem; }
            .controls { gap: 12px; }
        }
    </style>
</head>
<body>

<div class="player-card" id="app">
    <!-- 文件选择界面 -->
    <div id="fileSelectArea" class="file-select-area">
        <i class="fas fa-folder-open"></i>
        <p>📁 点击选择歌曲文件夹</p>
        <p class="hint">或直接将包含MP3的文件夹拖入此区域</p>
    </div>
    <input type="file" id="fileInput" class="hidden-input" webkitdirectory multiple accept="audio/mpeg">

    <!-- 加载状态 -->
    <div id="loadingState" class="loading-indicator" style="display: none;">
        <i class="fas fa-music fa-spin"></i>
        <p>正在扫描歌曲并读取封面...</p>
        <div class="progress-text" id="loadingProgress">准备中...</div>
    </div>

    <!-- 播放器内容（初始隐藏） -->
    <div id="playerContent" style="display: none;">
        <div class="top-section">
            <div class="cover-wrapper" id="coverWrapper">
                <img id="coverImage" src="" alt="封面" style="display: none;">
                <div class="cover-placeholder" id="coverPlaceholder">
                    <i class="fas fa-music"></i>
                </div>
                <div class="cover-loading" id="coverLoading" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </div>
            <div class="song-info">
                <div class="song-title" id="songTitle">
                    未选择歌曲
                    <span class="status-badge" id="tagStatus">📄 文件名</span>
                </div>
                <div class="song-artist" id="songArtist">未知艺术家</div>
                <div class="progress-area">
                    <input type="range" class="progress-bar" id="progressSlider" value="0" min="0" max="100" step="0.1">
                    <div class="time-labels">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="shuffleBtn" title="随机播放"><i class="fas fa-random"></i></button>
            <button id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
            <button id="nextBtn"><i class="fas fa-step-forward"></i></button>
            <button id="loopBtn" title="循环模式"><i class="fas fa-repeat"></i></button>
        </div>

        <div class="lyrics-box" id="lyricsBox">
            <p id="lyricsText">暂无歌词信息</p>
        </div>

        <div class="queue-section">
            <div class="queue-header">
                <h3><i class="fas fa-list-ul"></i> 播放队列 <span id="songCount" style="font-weight:normal;color:#8888aa;font-size:0.8rem;"></span></h3>
                <div class="queue-actions">
                    <button id="showQueueBtn"><i class="fas fa-eye"></i> 查看</button>
                    <button id="changeFolderBtn"><i class="fas fa-folder-open"></i> 更换文件夹</button>
                </div>
            </div>
            <ul class="queue-list" id="queueList"></ul>
        </div>
    </div>
</div>

<script>
(function() {
    // ========== 状态 ==========
    let playlist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let shuffle = false;
    let loop = false;
    let audio = new Audio();
    let isDragging = false;
    let fileList = [];

    // DOM元素
    const fileSelectArea = document.getElementById('fileSelectArea');
    const fileInput = document.getElementById('fileInput');
    const loadingState = document.getElementById('loadingState');
    const loadingProgress = document.getElementById('loadingProgress');
    const playerContent = document.getElementById('playerContent');
    const coverImg = document.getElementById('coverImage');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const coverLoading = document.getElementById('coverLoading');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const tagStatus = document.getElementById('tagStatus');
    const lyricsText = document.getElementById('lyricsText');
    const progressSlider = document.getElementById('progressSlider');
    const currentTimeLabel = document.getElementById('currentTime');
    const totalTimeLabel = document.getElementById('totalTime');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const loopBtn = document.getElementById('loopBtn');
    const queueListEl = document.getElementById('queueList');
    const songCount = document.getElementById('songCount');
    const changeFolderBtn = document.getElementById('changeFolderBtn');

    // ========== 工具函数 ==========
    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function getFileExtension(filename) {
        return filename.split('.').pop().toLowerCase();
    }

    // 从文件名提取歌曲信息
    function parseSongFromFilename(filename) {
        const name = filename.replace(/\.[^.]+$/, '');
        let artist = '未知艺术家';
        let title = name;
        
        if (name.includes(' - ')) {
            const parts = name.split(' - ');
            artist = parts[0].trim();
            title = parts.slice(1).join(' - ').trim();
        } else if (name.includes(' – ')) {
            const parts = name.split(' – ');
            artist = parts[0].trim();
            title = parts.slice(1).join(' – ').trim();
        }
        
        return { artist, title };
    }

    // 从MP3文件中读取元数据
    async function readMP3Metadata(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const metadata = await window.musicMetadata.parseBuffer(arrayBuffer, {
                duration: true,
                skipCovers: false
            });
            return metadata;
        } catch (error) {
            console.warn('读取MP3元数据失败:', error);
            return null;
        }
    }

    // 从元数据中提取封面图片
    function extractCoverFromMetadata(metadata) {
        try {
            if (!metadata || !metadata.common || !metadata.common.picture) {
                return null;
            }
            
            const picture = metadata.common.picture[0];
            if (!picture || !picture.data) return null;
            
            const data = picture.data;
            const format = picture.format || 'image/jpeg';
            
            const blob = new Blob([data], { type: format });
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function() {
                    resolve(reader.result);
                };
                reader.onerror = function() {
                    resolve(null);
                };
                reader.readAsDataURL(blob);
            });
        } catch (error) {
            console.warn('提取封面失败:', error);
            return null;
        }
    }

    // 从元数据中提取歌词
    function extractLyricsFromMetadata(metadata) {
        try {
            if (!metadata || !metadata.common) return null;
            const lyrics = metadata.common.lyrics || 
                          metadata.common.unsyncedlyrics || 
                          null;
            if (lyrics) {
                if (typeof lyrics === 'string') return lyrics;
                if (Array.isArray(lyrics) && lyrics.length > 0) {
                    return lyrics[0] || null;
                }
            }
            return null;
        } catch (error) {
            return null;
        }
    }

    // ========== 核心功能 ==========
    
    // 处理选择的文件夹
    async function handleFolder(files) {
        // 筛选出MP3文件
        const mp3Files = [];
        for (const file of files) {
            if (file.type === 'audio/mpeg' || getFileExtension(file.name) === 'mp3') {
                mp3Files.push(file);
            }
        }

        if (mp3Files.length === 0) {
            alert('❌ 没有找到MP3文件！请选择包含MP3的文件夹。');
            return;
        }

        // 显示加载状态
        fileSelectArea.style.display = 'none';
        loadingState.style.display = 'block';
        playerContent.style.display = 'none';
        loadingProgress.textContent = `发现 ${mp3Files.length} 首歌曲，正在读取元数据...`;

        // 扫描所有歌曲
        const songs = [];
        let processed = 0;

        for (const file of mp3Files) {
            try {
                const fileInfo = parseSongFromFilename(file.name);
                
                const song = {
                    id: `song_${processed}`,
                    title: fileInfo.title,
                    artist: fileInfo.artist,
                    file: file,
                    fileUrl: URL.createObjectURL(file),
                    lyrics: '暂无歌词信息',
                    coverData: null,
                    coverLoaded: false,
                    metadataLoaded: false
                };
                
                songs.push(song);
                
                processed++;
                loadingProgress.textContent = `正在读取第 ${processed}/${mp3Files.length} 首: ${file.name}`;
                
                // 读取MP3元数据
                try {
                    const metadata = await readMP3Metadata(file);
                    if (metadata) {
                        const coverBase64 = await extractCoverFromMetadata(metadata);
                        if (coverBase64) {
                            song.coverData = coverBase64;
                            song.coverLoaded = true;
                        }
                        
                        const lyrics = extractLyricsFromMetadata(metadata);
                        if (lyrics) {
                            song.lyrics = lyrics;
                        }
                        
                        if (metadata.common && metadata.common.title) {
                            song.title = metadata.common.title;
                        }
                        if (metadata.common && metadata.common.artist) {
                            song.artist = metadata.common.artist;
                        }
                        
                        song.metadataLoaded = true;
                    }
                } catch (error) {
                    console.warn(`读取 ${file.name} 元数据失败:`, error);
                }
                
                // 小延迟避免UI卡顿
                await new Promise(r => setTimeout(r, 50));
                
            } catch (error) {
                console.warn(`处理 ${file.name} 失败:`, error);
            }
        }

        loadingProgress.textContent = `✅ 完成！共加载 ${songs.length} 首歌曲`;
        
        // 保存播放列表
        playlist = songs;
        fileList = mp3Files;

        if (playlist.length === 0) {
            loadingProgress.textContent = '❌ 没有找到歌曲';
            return;
        }

        // 隐藏加载状态，显示播放器
        loadingState.style.display = 'none';
        playerContent.style.display = 'block';
        
        songCount.textContent = `${playlist.length} 首`;

        // 加载第一首歌
        currentIndex = 0;
        loadSong(0);
        renderQueue();
    }

    // 加载歌曲
    function loadSong(index) {
        if (!playlist.length) return;
        if (index < 0) index = 0;
        if (index >= playlist.length) index = playlist.length - 1;
        currentIndex = index;
        const song = playlist[currentIndex];
        if (!song) return;

        // 如果之前有URL，释放
        if (audio.src) {
            URL.revokeObjectURL(audio.src);
        }
        
        // 使用文件对象的URL
        audio.src = song.fileUrl;
        audio.load();
        
        // 更新UI
        updatePlayerUI(song);
        
        progressSlider.value = 0;
        currentTimeLabel.textContent = '0:00';
        
        audio.onloadedmetadata = function() {
            totalTimeLabel.textContent = formatTime(audio.duration);
            progressSlider.max = audio.duration || 100;
        };
        
        if (isPlaying) {
            audio.play().catch(e => console.warn('播放失败'));
        }
        renderQueue();
    }

    // 更新UI
    function updatePlayerUI(song) {
        if (!song) return;
        
        songTitle.textContent = song.title || '未知歌曲';
        songArtist.textContent = song.artist || '未知艺术家';
        
        if (song.metadataLoaded) {
            tagStatus.textContent = '📀 已读取';
            tagStatus.style.color = '#6fcf97';
        } else {
            tagStatus.textContent = '📄 文件名';
            tagStatus.style.color = '#f2c94a';
        }
        
        // 更新封面
        if (song.coverData && song.coverLoaded) {
            coverImg.style.display = 'block';
            coverPlaceholder.style.display = 'none';
            coverImg.src = song.coverData;
            coverLoading.style.display = 'none';
        } else {
            coverImg.style.display = 'none';
            coverPlaceholder.style.display = 'flex';
            coverLoading.style.display = 'none';
        }
        
        lyricsText.textContent = song.lyrics || '暂无歌词信息';
    }

    // 渲染队列
    function renderQueue() {
        if (!queueListEl) return;
        queueListEl.innerHTML = '';
        playlist.forEach((song, idx) => {
            const li = document.createElement('li');
            if (idx === currentIndex) li.classList.add('active');
            
            const tagIcon = song.metadataLoaded ? '📀' : '📄';
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'q-title';
            titleSpan.textContent = `${tagIcon} ${song.title || '未命名'}`;
            
            const artistSpan = document.createElement('span');
            artistSpan.className = 'q-artist';
            artistSpan.textContent = song.artist || '';
            
            const removeBtn = document.createElement('button');
            removeBtn.className = 'q-remove';
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
            removeBtn.setAttribute('data-index', idx);
            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const index = parseInt(removeBtn.getAttribute('data-index'));
                removeFromQueue(index);
            });

            const leftPart = document.createElement('span');
            leftPart.appendChild(titleSpan);
            leftPart.appendChild(artistSpan);

            li.appendChild(leftPart);
            li.appendChild(removeBtn);

            li.addEventListener('click', () => {
                if (idx === currentIndex) {
                    togglePlay();
                } else {
                    loadSong(idx);
                    if (isPlaying) {
                        audio.play().catch(e => console.warn('播放失败'));
                    } else {
                        isPlaying = false;
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    }
                }
            });
            queueListEl.appendChild(li);
        });
    }

    // 从队列移除
    function removeFromQueue(index) {
        if (index < 0 || index >= playlist.length) return;
        if (index === currentIndex) {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            if (playlist.length === 1) {
                playlist = [];
                currentIndex = 0;
                updatePlayerUI({ title: '—', artist: '—', lyrics: '暂无歌曲' });
                renderQueue();
                return;
            }
            const newIndex = index < playlist.length - 1 ? index : index - 1;
            playlist.splice(index, 1);
            currentIndex = newIndex >= playlist.length ? playlist.length - 1 : newIndex;
            loadSong(currentIndex);
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            renderQueue();
            return;
        }
        playlist.splice(index, 1);
        if (index < currentIndex) currentIndex--;
        if (currentIndex >= playlist.length) currentIndex = playlist.length - 1;
        renderQueue();
        if (playlist.length > 0) {
            updatePlayerUI(playlist[currentIndex]);
        } else {
            updatePlayerUI({ title: '—', artist: '—', lyrics: '暂无歌曲' });
        }
        songCount.textContent = `${playlist.length} 首`;
    }

    // 播放控制
    function togglePlay() {
        if (!playlist.length) return;
        if (audio.paused) {
            audio.play().catch(e => console.warn('播放失败', e));
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
    }

    function nextSong() {
        if (!playlist.length) return;
        let nextIdx = currentIndex + 1;
        if (shuffle) {
            if (playlist.length === 1) {
                nextIdx = 0;
            } else {
                do {
                    nextIdx = Math.floor(Math.random() * playlist.length);
                } while (nextIdx === currentIndex);
            }
        } else {
            if (nextIdx >= playlist.length) nextIdx = 0;
        }
        loadSong(nextIdx);
        if (isPlaying) {
            audio.play().catch(e => console.warn('播放失败'));
        }
    }

    function prevSong() {
        if (!playlist.length) return;
        let prevIdx = currentIndex - 1;
        if (shuffle) {
            if (playlist.length === 1) {
                prevIdx = 0;
            } else {
                do {
                    prevIdx = Math.floor(Math.random() * playlist.length);
                } while (prevIdx === currentIndex);
            }
        } else {
            if (prevIdx < 0) prevIdx = playlist.length - 1;
        }
        loadSong(prevIdx);
        if (isPlaying) {
            audio.play().catch(e => console.warn('播放失败'));
        }
    }

    // 重置播放器（更换文件夹）
    function resetPlayer() {
        // 停止播放
        audio.pause();
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        if (audio.src) {
            URL.revokeObjectURL(audio.src);
        }
        
        // 重置状态
        playlist = [];
        currentIndex = 0;
        
        // 显示文件选择界面
        playerContent.style.display = 'none';
        fileSelectArea.style.display = 'block';
        loadingState.style.display = 'none';
        
        // 重置file input
        fileInput.value = '';
    }

    // ========== 事件绑定 ==========
    
    // 点击选择文件夹
    fileSelectArea.addEventListener('click', () => {
        fileInput.click();
    });

    // 拖拽支持
    fileSelectArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileSelectArea.style.borderColor = '#b084f0';
        fileSelectArea.style.background = 'rgba(176, 132, 240, 0.1)';
    });

    fileSelectArea.addEventListener('dragleave', () => {
        fileSelectArea.style.borderColor = '#40405a';
        fileSelectArea.style.background = 'transparent';
    });

    fileSelectArea.addEventListener('drop', (e) => {
        e.preventDefault();
        fileSelectArea.style.borderColor = '#40405a';
        fileSelectArea.style.background = 'transparent';
        
        const items = e.dataTransfer.items;
        const files = [];
        
        // 递归获取所有文件
        const getFiles = async (entry) => {
            if (entry.isFile) {
                const file = await new Promise(resolve => entry.file(resolve));
                files.push(file);
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                const entries = await new Promise(resolve => reader.readEntries(resolve));
                for (const subEntry of entries) {
                    await getFiles(subEntry);
                }
            }
        };
        
        const promises = [];
        for (const item of items) {
            const entry = item.webkitGetAsEntry();
            if (entry) {
                promises.push(getFiles(entry));
            }
        }
        
        Promise.all(promises).then(() => {
            if (files.length > 0) {
                handleFolder(files);
            }
        });
    });

    // 文件选择
    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files.length > 0) {
            handleFolder(files);
        }
    });

    // 播放控制
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextSong);
    prevBtn.addEventListener('click', prevSong);
    
    shuffleBtn.addEventListener('click', function() {
        shuffle = !shuffle;
        this.classList.toggle('active-mode', shuffle);
    });
    
    loopBtn.addEventListener('click', function() {
        loop = !loop;
        this.classList.toggle('active-mode', loop);
        audio.loop = loop;
    });

    progressSlider.addEventListener('input', function() {
        if (audio.duration) {
            const val = parseFloat(this.value);
            audio.currentTime = val;
            currentTimeLabel.textContent = formatTime(val);
        }
    });

    audio.addEventListener('timeupdate', function() {
        if (!isDragging && audio.duration) {
            progressSlider.value = audio.currentTime;
            currentTimeLabel.textContent = formatTime(audio.currentTime);
            if (!totalTimeLabel.textContent || totalTimeLabel.textContent === '0:00') {
                totalTimeLabel.textContent = formatTime(audio.duration);
            }
        }
    });

    audio.addEventListener('ended', function() {
        if (loop) {
            audio.currentTime = 0;
            audio.play().catch(e => console.warn('循环播放失败'));
            return;
        }
        nextSong();
    });

    audio.addEventListener('loadedmetadata', function() {
        totalTimeLabel.textContent = formatTime(audio.duration);
        progressSlider.max = audio.duration || 100;
    });

    document.getElementById('showQueueBtn').addEventListener('click', function() {
        document.querySelector('.queue-section').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    changeFolderBtn.addEventListener('click', resetPlayer);

    progressSlider.addEventListener('mousedown', () => { isDragging = true; });
    progressSlider.addEventListener('mouseup', () => { isDragging = false; });
    progressSlider.addEventListener('touchstart', () => { isDragging = true; });
    progressSlider.addEventListener('touchend', () => { isDragging = false; });

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
        }
    });

    // ========== 检查库是否加载 ==========
    if (typeof window.musicMetadata === 'undefined') {
        // 如果库还没加载，等待
        const checkLib = setInterval(() => {
            if (typeof window.musicMetadata !== 'undefined') {
                clearInterval(checkLib);
                console.log('✅ music-metadata 库已加载');
            }
        }, 500);
    }

    console.log('🎵 本地音乐播放器已启动！');
    console.log('📁 点击上方区域选择包含MP3的文件夹');
</script>
</body>
</html>
